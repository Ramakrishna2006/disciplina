name: tests

# Each change is tested once: pushes to main, and every pull request (which covers pushes to
# the studio branch while its pull request is open). "Run workflow" on GitHub starts it by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the older, still-running test run.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Gradient check (hand-written backprop vs numerical)
        run: python tests/test_gradients.py
      - name: Tokenizer tests
        run: python tests/test_tokenizer.py
      - name: Trained models answer all 60 held-out questions, with no forgetting
        run: python tests/test_model.py
      - name: Experiment pipeline (same weights as the original recipe, progress, cancel)
        run: python tests/test_experiment.py
      - name: Chat command answers a held-out question
        run: printf "Where does Leela live?\n" | python main.py chat | grep -q "Surat"
      - name: Dataset export is reproducible (matches the committed data/)
        run: python main.py data && git diff --exit-code data/ DATASET.md
      - name: End-to-end training smoke test
        run: python main.py train --quick --dir test_run

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r backend/requirements-dev.in
      - name: Lint (ruff)
        run: ruff check backend
      - name: Backend tests (accounts, chat, dataset, experiments, dashboard, security, migrations)
        run: pytest
      - name: Real training through the web runner (about a minute)
        run: RUN_SLOW=1 pytest backend/tests/test_experiments.py -k real_training
      - name: Migrations build the database from nothing, and seeding twice is safe
        run: |
          flask --app backend.app db upgrade
          flask --app backend.app seed
          flask --app backend.app seed | grep -q "already there"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Frontend tests (forms, route guards, API client, pages)
        run: npm test
      - name: Type-check and production build
        run: npm run build
